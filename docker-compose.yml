# Логи контейнеров: без лимита json-file растёт бесконечно и за месяцы забивает диск.
x-logging: &logging
  driver: json-file
  options: {max-size: "20m", max-file: "5"}

# Контейнеры приложения (23.09.2026): процесс не root (Dockerfile), корень только на чтение, без привилегий
# и с потолком памяти и процессов — уязвимость в зависимости или утечка памяти не выходят за пределы своего
# контейнера и не кладут хост, на котором живёт и база. Обычный расход — 120–180 МБ на процесс.
x-app: &app
  build: .
  env_file: .env
  # init: сигналы доходят до процесса, а не до PID 1 без обработчика; зомби-процессы подбираются (24.09.2026).
  init: true
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  pids_limit: 256
  mem_limit: 768m
  logging: *logging

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rezka
      POSTGRES_USER: rezka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rezka"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 2g
    pids_limit: 512
    logging: *logging
    # Наружу порт не публикуем — только внутренняя сеть compose.

  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  bot:
    <<: *app
    command: python -m app.bot.main
    stop_grace_period: 30s   # дать закончить запросы в обработке при перезапуске
    depends_on:
      migrate: {condition: service_completed_successfully}
    extra_hosts: ["host.docker.internal:host-gateway"]   # доступ к SSH-туннелю на хосте
    restart: unless-stopped

  poller:
    <<: *app
    command: python -m app.poller
    stop_grace_period: 120s  # по SIGTERM поллер доделывает текущую страницу и выходит (app/lifecycle.py)
    # Здоровье — не «цикл завершился», а «события идут» (app/health.py): видно в `docker compose ps`.
    healthcheck:
      test: ["CMD", "python", "-m", "app.health", "events"]
      interval: 5m
      timeout: 60s
      start_period: 10m
      retries: 2
    depends_on:
      migrate: {condition: service_completed_successfully}
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  sender:
    <<: *app
    command: python -m app.sender
    stop_grace_period: 30s   # по SIGTERM досылает текущее сообщение, остальное взятое — сразу в очередь
    # Здоровье доставки: уведомления не залёживаются, не зависают в повторах и не падают (app/health.py).
    healthcheck:
      test: ["CMD", "python", "-m", "app.health", "delivery"]
      interval: 5m
      timeout: 60s
      start_period: 5m
      retries: 2
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

  # Тесты — отдельная цель образа (без неё в боевом нет ни pytest, ни tests/). Только на базе *_test:
  #   docker compose --profile test run --rm --no-deps tests
  tests:
    <<: *app
    build: {context: ., target: test}
    profiles: [test]
    command: sh -c 'TEST_DATABASE_URL="$${DATABASE_URL%/*}/rezka_test" python -m pytest -q -p no:cacheprovider'

volumes:
  pgdata:

networks:
  default:
    ipam:
      config:
        # Подсеть зафиксирована: на шлюз 172.28.0.1 привязан SSH-туннель
        # (см. deploy/rezka-tunnel.service). Адрес приватный, снаружи недоступен.
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
